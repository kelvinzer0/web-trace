[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-trace"
version = "1.0.0"
description = "Browser-based HAR recorder for bug bounty hunting. Playwright captures XHR/Fetch/WebSocket traffic with TLS fingerprint impersonation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "kelvinzer0"},
]
keywords = ["bug-bounty", "har", "playwright", "tls", "fingerprint", "security", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "playwright>=1.40.0",
    "curl_cffi>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/kelvinzer0/web-trace"
Repository = "https://github.com/kelvinzer0/web-trace"
Issues = "https://github.com/kelvinzer0/web-trace/issues"

[project.scripts]
web-trace = "web_trace:main"

[tool.setuptools.packages.find]
include = ["web_trace*"]

[tool.setuptools.package-data]
web_trace = ["stealth.js"]
